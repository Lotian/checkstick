# 囍签 · 单域名部署（推荐，零额外配置）
#
#   玩家端  https://your-domain.com/
#   管理端  https://your-domain.com/admin/
#   接口    https://your-domain.com/api/  ->  127.0.0.1:8080
#   静态包  /opt/xiqian/current/player 与 /opt/xiqian/current/admin
#
# 安装：
#   cp deploy/nginx-xiqian.conf /etc/nginx/sites-available/xiqian.conf
#   ln -sf /etc/nginx/sites-available/xiqian.conf /etc/nginx/sites-enabled/xiqian.conf
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d your-domain.com      # 自动追加 443 并把 80 跳转过去
#
# 使用前把 your-domain.com 全部替换为真实域名。

server {
    listen 80;
    server_name your-domain.com;

    charset utf-8;
    client_max_body_size 2m;

    # ---------------- 玩家端 H5 ----------------
    # history 路由模式，必须用 try_files 兜底到 index.html
    root /opt/xiqian/current/player;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ---------------- 管理后台 ----------------
    # 构建产物里写死了 /admin/assets/ 绝对路径，所以只能挂在 /admin/ 下
    location = /admin {
        return 301 /admin/;
    }

    location /admin/ {
        # root 指向 releases 目录，使 /admin/xxx 落到 /opt/xiqian/current/admin/xxx
        root /opt/xiqian/current;
        try_files $uri $uri/ /admin/index.html;
    }

    location /admin/assets/ {
        root /opt/xiqian/current;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ---------------- 管理端实时进度（SSE）----------------
    # 必须关闭响应缓冲，否则后台的落签进度不会实时刷新（要等连接结束才吐出）
    location ~ ^/api/admin/rounds/[^/]+/events$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        # 后端 spring.mvc.async.request-timeout 是 30m，这里要放得更宽
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------------- 接口 ----------------
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ---------------- 健康检查只对本机开放 ----------------
    location /actuator/ {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:8080;
    }
}
