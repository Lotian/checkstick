# 囍签 · 分域名部署（玩家端与后台各用独立域名）
#
#   玩家端  https://h5.your-domain.com/
#   管理端  https://admin.your-domain.com/admin/
#
# 两个域名都要各自反代 /api：两个前端用的都是相对路径 baseURL '/api'，
# 浏览器视角下始终同源，因此不需要后端开 CORS。
#
# 关键一步：/etc/xiqian/draw.env 里必须设置
#   PUBLIC_BASE_URL=https://h5.your-domain.com/
# 否则后台"玩家扫码处"的二维码会指向后台自己的域名。
#
# 安装：
#   cp deploy/nginx-xiqian-split.conf /etc/nginx/sites-available/xiqian.conf
#   ln -sf /etc/nginx/sites-available/xiqian.conf /etc/nginx/sites-enabled/xiqian.conf
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d h5.your-domain.com -d admin.your-domain.com
#
# 使用前把 h5.your-domain.com / admin.your-domain.com 替换为真实域名。

# 公共的代理头，避免两个 server 块重复书写
# （nginx 不允许在 http 块外 include，这里直接写在两个块里）

# ================= 玩家端 =================
server {
    listen 80;
    server_name h5.your-domain.com;

    charset utf-8;
    client_max_body_size 2m;

    root /opt/xiqian/current/player;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 玩家端也会调用 /api/public/**（查状态与抽签），必须反代
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /actuator/ {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:8080;
    }
}

# ================= 管理后台 =================
server {
    listen 80;
    server_name admin.your-domain.com;

    charset utf-8;
    client_max_body_size 2m;

    location = /admin {
        return 301 /admin/;
    }

    location /admin/ {
        root /opt/xiqian/current;
        try_files $uri $uri/ /admin/index.html;
    }

    location /admin/assets/ {
        root /opt/xiqian/current;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 直接访问域名根路径时给个入口，避免看到 404
    location = / {
        return 302 /admin/;
    }

    # 管理端实时进度（SSE）：必须关闭响应缓冲
    location ~ ^/api/admin/rounds/[^/]+/events$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /actuator/ {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:8080;
    }
}
